<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AO Universe — Master Map</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ao-void-black: #000000;
            --ao-deep-space: #0A0A10;
            --neon-cyan: #00eaff;
            --neon-magenta: #ff00c8;
            --metallic-gold: #d8ae55;
            --font-headline: "Space Mono", monospace;
            --font-body: "Inter", sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--ao-void-black);
            background-image: radial-gradient(circle at center, var(--ao-deep-space) 0%, var(--ao-void-black) 80%);
            color: #ffffff;
            font-family: var(--font-body);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .map-grid {
            position: relative;
            width: 800px;
            height: 450px;
            border: 1px solid rgba(216, 174, 85, 0.15);
            background: rgba(10, 10, 16, 0.7);
            border-radius: 12px;
            box-shadow: inset 0 0 40px rgba(216, 174, 85, 0.05), 0 0 30px rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .map-grid::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
            z-index: 5;
        }

        .filaments-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            opacity: 0.25;
        }

        .node-pin {
            position: absolute;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
        }

        .node-pin::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 32px;
            height: 32px;
            border: 1px solid inherit;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: pulse-ring 3s infinite linear;
        }

        @keyframes pulse-ring {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(2); opacity: 0; }
        }

        #pin-lib {
            top: 25%;
            left: 20%;
            background: var(--neon-cyan);
            box-shadow: 0 0 15px var(--neon-cyan);
            border-color: var(--neon-cyan);
        }

        #pin-store {
            top: 70%;
            left: 80%;
            background: var(--metallic-gold);
            box-shadow: 0 0 15px var(--metallic-gold);
            border-color: var(--metallic-gold);
        }

        #pin-nexus {
            top: 40%;
            left: 50%;
            background: var(--neon-magenta);
            box-shadow: 0 0 15px var(--neon-magenta);
            border-color: var(--neon-magenta);
        }

        .node-pin:hover {
            transform: scale(1.6);
            z-index: 100;
        }

        .map-legend {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-family: var(--font-headline);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--metallic-gold);
            z-index: 10;
        }

        .map-legend span {
            color: var(--neon-cyan);
        }
    </style>
</head>
<body>

    <div class="map-grid">
        <svg class="filaments-layer" viewBox="0 0 100 100" preserveAspectRatio="none">
            <line x1="50" y1="0" x2="50" y2="100" stroke="#d8ae55" stroke-width="0.1" stroke-dasharray="1 1"/>
            <line x1="0" y1="50" x2="100" y2="50" stroke="#d8ae55" stroke-width="0.1" stroke-dasharray="1 1"/>
            
            <circle cx="50" cy="50" r="15" fill="none" stroke="#d8ae55" stroke-width="0.1"/>
            <circle cx="50" cy="50" r="30" fill="none" stroke="#d8ae55" stroke-width="0.1" stroke-dasharray="2 2"/>
            <circle cx="50" cy="50" r="45" fill="none" stroke="#d8ae55" stroke-width="0.1"/>

            <path d="M 20 25 Q 35 30 50 40" fill="none" stroke="#00eaff" stroke-width="0.2" opacity="0.6"/>
            <path d="M 50 40 Q 65 55 80 70" fill="none" stroke="#d8ae55" stroke-width="0.2" opacity="0.6"/>
        </svg>

        <div class="node-pin" id="pin-lib" title="Library World (anomartsy.xyz)" onclick="window.parent.location.href='https://anomartsy.xyz/'"></div>
        <div class="node-pin" id="pin-nexus" title="The Nexus Command (Gateway Core)" onclick="window.parent.location.href='https://anomartsy.xyz/universe.html'"></div>
        <div class="node-pin" id="pin-store" title="The Gold Store (anomarsty.lol)" onclick="window.parent.location.href='https://anomarsty.lol/'"></div>

        <div class="map-legend">
            AO UNIVERSE // <span>LIVE MAP TELEMETRY</span>
        </div>
    </div>

</body>
</html>
